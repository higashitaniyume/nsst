name: CI

# Runs on every push to main and every pull request, so a broken tree is caught
# before it is tagged. Tag pushes are handled by the Release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race -count=1 ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Type-check and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assert the bundle was emitted
        run: |
          set -euo pipefail
          test -f internal/webui/dist/index.html
          ls -l internal/webui/dist internal/webui/dist/assets

  image:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nsst:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startup, the three stream endpoints and the embedded console are all
      # exercised here: the image is what actually ships, so it gets tested.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name nsst-ci -p 8080:8080 nsst:ci

          echo "waiting for the server to become healthy"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "health: $(curl -fsS http://localhost:8080/api/health)"

          frames=$(curl -fsSN "http://localhost:8080/api/stream/http?duration=1&interval=250&payload_size=16" | wc -l)
          echo "http frames: ${frames} (expected 4)"
          test "${frames}" -eq 4

          events=$(curl -fsSN "http://localhost:8080/api/stream/sse?duration=1&interval=250&payload_size=0" | grep -c '^data:')
          echo "sse events: ${events} (expected 4)"
          test "${events}" -eq 4

          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi 'doctype html' /tmp/index.html
          asset=$(grep -o 'assets/[^"]*\.js' /tmp/index.html | head -1)
          echo "console bundle: ${asset}"
          curl -fsS -o /dev/null "http://localhost:8080/${asset}"

          echo "--- container logs ---"
          docker logs nsst-ci

      - name: Container logs on failure
        if: failure()
        run: docker logs nsst-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f nsst-ci || true
