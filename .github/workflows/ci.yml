name: CI

# Runs on every push to main and every pull request, so a broken tree is caught
# before it is tagged. Tag pushes are handled by the Release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Type-check and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Assert the bundle was emitted
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          ls -l web/dist web/dist/assets

      # The server embeds this directory at compile time, so the next job cannot
      # build a correct server without it. Handing it over as an artifact is what
      # makes that ordering visible instead of an implicit assumption.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Keyed on the project files, since the repository uses no lock file.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Must happen before build/test: Nsst.Server.csproj embeds web/dist as an
      # assembly resource. Without it the build still succeeds and the tests
      # still pass, but they pass against a server with no console in it.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Restore
        run: dotnet restore dotnet/Nsst.slnx

      # A real gate rather than a permanently red one: the tree is format-clean.
      - name: Check formatting
        run: dotnet format dotnet/Nsst.slnx --verify-no-changes --no-restore

      # TreatWarningsAsErrors is on in Directory.Build.props, so this is also the
      # static-analysis step; there is no separate lint tool to run.
      - name: Build
        run: dotnet build dotnet/Nsst.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test dotnet/Nsst.slnx -c Release --no-build --nologo

  image:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nsst:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Startup, the three stream endpoints and the embedded console are all
      # exercised here: the image is what actually ships, so it gets tested.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name nsst-ci -p 8080:8080 nsst:ci

          echo "waiting for the server to become healthy"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "health: $(curl -fsS http://localhost:8080/api/health)"

          # duration=1s at interval=250ms means t=0,250,500,750 -- four frames,
          # because t=1000 is not < duration.
          frames=$(curl -fsSN "http://localhost:8080/api/stream/http?duration=1&interval=250&payload_size=16" | wc -l)
          echo "http frames: ${frames} (expected 4)"
          test "${frames}" -eq 4

          events=$(curl -fsSN "http://localhost:8080/api/stream/sse?duration=1&interval=250&payload_size=0" | grep -c '^data:')
          echo "sse events: ${events} (expected 4)"
          test "${events}" -eq 4

          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi 'doctype html' /tmp/index.html
          asset=$(grep -o 'assets/[^"]*\.js' /tmp/index.html | head -1)
          echo "console bundle: ${asset}"
          curl -fsS -o /dev/null "http://localhost:8080/${asset}"

          echo "--- container logs ---"
          docker logs nsst-ci

      - name: Container logs on failure
        if: failure()
        run: docker logs nsst-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f nsst-ci || true
