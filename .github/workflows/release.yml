name: Release

# Pushing a tag such as v1.2.3 does three things:
#
#   1. verifies the tree (format, build with warnings-as-errors, tests, frontend)
#   2. builds and pushes the container image, tagged 1.2.3 / 1.2 / latest
#   3. creates the GitHub release with auto-generated notes
#
# Image targets:
#   ghcr.io/<owner>/nsst   always, using the built-in GITHUB_TOKEN (no setup)
#   <DOCKERHUB_USERNAME>/nsst   only when the Docker Hub secrets are configured
#
# Required secrets for Docker Hub (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   e.g. hyumerin
#   DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write
#
# Without those two secrets the release still succeeds; only the Docker Hub push
# is skipped, and GHCR receives the image instead.
#
# There is deliberately no downloadable-binary job any more. The Go build could
# emit self-contained static binaries for five platform pairs; a
# framework-dependent ASP.NET Core publish cannot, and per-RID self-contained or
# NativeAOT publishing would need native runners per platform. The container
# image is the supported artifact. See README "发布流程".

on:
  push:
    tags:
      - "v*"
  # Manual dry run from the Actions tab: builds everything but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  packages: write # push to GHCR

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------- quality gate
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the console
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Same reasoning as CI: the server embeds the console at compile time, so
      # the artifact is handed forward rather than assumed to be present.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/**/*.csproj', 'dotnet/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Restore
        run: dotnet restore dotnet/Nsst.slnx

      - name: Check formatting
        run: dotnet format dotnet/Nsst.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build dotnet/Nsst.slnx -c Release --no-restore --nologo

      - name: Test
        run: dotnet test dotnet/Nsst.slnx -c Release --no-build --nologo

  # ------------------------------------------------------------------ container
  container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Docker Hub is optional: without the two secrets the image is published to
      # GHCR only, so a tag push always produces a usable image.
      - name: Collect image names
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          list="ghcr.io/${GITHUB_REPOSITORY}"
          has_dockerhub=false
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            list="${list}"$'\n'"${DOCKERHUB_USERNAME}/nsst"
            has_dockerhub=true
          fi
          {
            echo "list<<IMAGES_EOF"
            printf '%s\n' "$list"
            echo "IMAGES_EOF"
            echo "has_dockerhub=${has_dockerhub}"
          } >> "$GITHUB_OUTPUT"
          echo "publishing to:"
          printf '%s\n' "$list"

      # Still needed: the compiler and frontend stages are pinned to
      # $BUILDPLATFORM, but the final Alpine stage runs its own RUN steps
      # (creating uid 10001) in the target architecture.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # `latest` is added explicitly below so that a pre-release tag such as
          # v1.2.3-rc1 never moves it.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A manual run builds the image but does not publish it.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGES: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Container image ${VERSION}"
            echo
            echo '```'
            echo "${IMAGES}"
            echo '```'
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------- notes
  notes:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # --generate-notes needs the history back to the previous tag.
          fetch-depth: 0

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Re-running a failed workflow should not fail on the existing release.
            echo "release ${GITHUB_REF_NAME} already exists; leaving it in place"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### Released ${GITHUB_REF_NAME}"
            echo
            echo "This release carries no binary assets: the supported artifact is"
            echo "the container image, which is published by the container job."
          } >> "$GITHUB_STEP_SUMMARY"
