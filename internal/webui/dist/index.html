<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Measure the stability of long-lived HTTP streaming, Server-Sent Events and WebSocket connections."
    />
    <title data-i18n="app.title">Network Stream Stability Tester</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="/assets/index-B0OSg75s.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BBoB25JO.css">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <h1 data-i18n="app.title"></h1>
            <p data-i18n="app.subtitle"></p>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="server-chip offline" id="server-chip"></span>
          <button
            type="button"
            class="button ghost"
            id="lang-toggle"
            data-i18n="lang.switch"
            data-i18n-title="lang.switchTitle"
          ></button>
        </div>
      </header>

      <main class="layout">
        <!-- Run state and the one control that always applies. -->
        <section class="panel runbar">
          <div class="runbar-text">
            <span class="run-state" id="run-state"></span>
            <span class="run-note" id="run-note"></span>
          </div>
          <button type="button" class="button danger" id="stop-button" data-i18n="run.stop" disabled></button>
        </section>

        <!-- Six tables: two per protocol, generated by views.ts. -->
        <section class="protocol-grid" id="protocol-grid"></section>

        <section class="panel chart-panel">
          <h2 class="section-title" data-i18n="chart.interval"></h2>
          <p class="hint" data-i18n="chart.intervalHint"></p>
          <div class="chart" id="chart-interval"></div>
        </section>

        <section class="panel chart-panel">
          <h2 class="section-title" data-i18n="chart.throughput"></h2>
          <p class="hint" data-i18n="chart.throughputHint"></p>
          <div class="chart" id="chart-throughput"></div>
        </section>

        <details class="panel chart-panel" id="peaks-panel">
          <summary class="section-title" data-i18n="chart.peaks"></summary>
          <p class="hint" data-i18n="chart.peaksHint"></p>
          <div class="chart" id="chart-peaks"></div>
        </details>

        <!-- Parameters for the next run; locked while a test is live. -->
        <section class="panel controls">
          <h2 class="section-title" data-i18n="cfg.title"></h2>
          <p class="notice" id="cfg-notice"></p>

          <div class="control-grid">
            <div class="control">
              <div class="control-label" data-i18n="cfg.protocols"></div>
              <div class="choices" id="cfg-protocols">
                <label class="check">
                  <input type="checkbox" value="http-stream" checked />
                  <span data-i18n="proto.http-stream"></span>
                </label>
                <label class="check">
                  <input type="checkbox" value="sse" checked />
                  <span data-i18n="proto.sse"></span>
                </label>
                <label class="check">
                  <input type="checkbox" value="websocket" checked />
                  <span data-i18n="proto.websocket"></span>
                </label>
              </div>
            </div>

            <div class="control">
              <div class="control-label" data-i18n="cfg.duration"></div>
              <div class="choices" id="cfg-duration">
                <button type="button" class="chip" data-value="60">60 s</button>
                <button type="button" class="chip" data-value="300">300 s</button>
                <button type="button" class="chip" data-value="1800">1800 s</button>
                <button type="button" class="chip" data-custom data-i18n="cfg.custom"></button>
                <input type="number" class="chip-input" data-custom-input hidden />
              </div>
            </div>

            <div class="control">
              <div class="control-label" data-i18n="cfg.interval"></div>
              <div class="choices" id="cfg-interval">
                <button type="button" class="chip" data-value="50">50 ms</button>
                <button type="button" class="chip" data-value="100">100 ms</button>
                <button type="button" class="chip" data-value="500">500 ms</button>
                <button type="button" class="chip" data-value="1000">1000 ms</button>
                <button type="button" class="chip" data-custom data-i18n="cfg.custom"></button>
                <input type="number" class="chip-input" data-custom-input hidden />
              </div>
            </div>

            <div class="control">
              <div class="control-label" data-i18n="cfg.payload"></div>
              <div class="choices" id="cfg-payload">
                <button type="button" class="chip" data-value="0">0 B</button>
                <button type="button" class="chip" data-value="64">64 B</button>
                <button type="button" class="chip" data-value="1024">1024 B</button>
                <button type="button" class="chip" data-value="65536">65536 B</button>
                <button type="button" class="chip" data-custom data-i18n="cfg.custom"></button>
                <input type="number" class="chip-input" data-custom-input hidden />
              </div>
            </div>
          </div>

          <div class="control-options">
            <div class="option">
              <label class="check">
                <input type="checkbox" id="cfg-until-stopped" />
                <span data-i18n="cfg.untilStopped"></span>
              </label>
              <p class="hint" data-i18n="cfg.untilStoppedHint"></p>
            </div>
            <div class="option">
              <label class="check">
                <input type="checkbox" id="cfg-auto-reconnect" />
                <span data-i18n="cfg.autoReconnect"></span>
              </label>
              <p class="hint" data-i18n="cfg.autoReconnectHint"></p>
            </div>
          </div>

          <button type="button" class="button primary" id="start-button" data-i18n="cfg.start"></button>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2 class="section-title" data-i18n="log.title"></h2>
            <button type="button" class="button ghost small" id="log-clear" data-i18n="log.clear"></button>
          </div>
          <ul class="log-list" id="log-list"></ul>
        </section>

        <section class="panel about">
          <h2 class="section-title" data-i18n="about.title"></h2>
          <p data-i18n="about.gap"></p>
          <p data-i18n="about.threshold"></p>
          <p data-i18n="about.bytes"></p>
          <p data-i18n="about.missing"></p>
          <p data-i18n="about.reconnects"></p>
          <h3 class="table-title" data-i18n="resources.title"></h3>
          <p class="mono muted" id="server-limits"></p>
        </section>
      </main>
    </div>
  </body>
</html>
