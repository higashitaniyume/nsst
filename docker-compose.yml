# Docker Compose definition for the Network Stream Stability Tester.
#
#   docker compose up -d              # run the published image (pulled if absent)
#   docker compose up -d --build      # build from source instead, then run
#   docker compose logs -f            # follow the server logs
#   docker compose down               # stop and remove
#
# The console, the REST API and all three stream endpoints are served from
#   http://localhost:55537
#
# Change the host port without editing this file:
#   NSST_PORT=60000 docker compose up -d

services:
  streamtest:
    # Both build: and image: are set on purpose. Compose tags a built image with
    # the name below, so `up --build` and `up` agree on what "hyumerin/nsst:0.1.0"
    # means locally. Without --build the published image is pulled when it is not
    # already present, which keeps a plain deploy from recompiling the project.
    image: hyumerin/nsst:0.1.0

    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamped into the binary; /api/health reports it back.
        VERSION: "0.1.0"

    pull_policy: missing

    container_name: streamtest

    ports:
      # host:container -- the server always listens on 8080 inside the
      # container, so only the left-hand side changes.
      - "${NSST_PORT:-55537}:8080"

    environment:
      # Listen address. Keep HOST at 0.0.0.0 inside a container.
      HOST: "0.0.0.0"
      PORT: "8080"

      # Parameter limits advertised by /api/config and enforced by the
      # handlers. These are the defaults compiled into the binary; they are
      # spelled out here so you can tune them without a rebuild.
      MAX_DURATION: "3600"            # longest accepted duration, seconds
      MAX_PAYLOAD_SIZE: "1048576"     # largest frame payload, bytes (1 MiB)
      MIN_INTERVAL: "10"              # fastest accepted pacing, milliseconds
      MAX_INTERVAL: "60000"           # slowest accepted pacing, milliseconds
      MAX_CONCURRENT_STREAMS: "100"   # simultaneous streams before HTTP 503
      WRITE_TIMEOUT_MS: "15000"       # per-frame write deadline

      # Graceful shutdown: live streams are drained for this long after SIGTERM.
      SHUTDOWN_TIMEOUT: "15"

      # Cross-origin access. Empty means same-origin only, which is what the
      # bundled console uses.
      CORS_ALLOW_ORIGINS: ""

      LOG_LEVEL: "info"               # debug | info | warn | error
      LOG_FORMAT: "text"              # text | json

    restart: unless-stopped

    # Must exceed SHUTDOWN_TIMEOUT so Docker does not SIGKILL a draining server.
    stop_grace_period: 20s

    healthcheck:
      # Probed inside the container, so this always uses the container port.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Long-lived streams need a file descriptor per concurrent connection, and
    # the process itself is tiny.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
